[project]
name = "goody-backend"
version = "0.1.0"
description = "GOODYEXCELLENT COUTURE API (FastAPI + PostgreSQL)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosmtplib>=5.1.3",
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.159.1",
    "pillow>=13.0.0",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.1",
    "pydantic[email]>=2.14.1",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.32",
    "slowapi>=0.1.10",
    "sqlalchemy[asyncio]>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
