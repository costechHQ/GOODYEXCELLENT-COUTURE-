# Local PostgreSQL for development. The API itself runs with uvicorn (see README).
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: goody
      POSTGRES_PASSWORD: goody
      POSTGRES_DB: goody
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goody -d goody"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
