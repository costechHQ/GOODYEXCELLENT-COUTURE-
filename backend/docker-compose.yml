# Local PostgreSQL only. The API runs with `uv run uvicorn app.main:app --reload`.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: goody
      POSTGRES_PASSWORD: goody
      POSTGRES_DB: goody
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
